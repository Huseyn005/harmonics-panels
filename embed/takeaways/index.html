<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takeaways &amp; What's Next — Interactive</title>
<link rel="stylesheet" href="/assets/embed.css">
<style>
</style>
</head>
<body>
<main class="embed">
  <section class="embed-body">

    <div class="tabpanel" id="p-day">
      <p class="lede" style="font-size:15px">Every result here is anchored to lunar noon (1360 W/m², M = 0.8). Slide toward dawn to see what changes and what is still to be measured.</p>
      <svg id="sky" class="chart" viewBox="0 0 700 220" role="img" aria-label="Sun position across the lunar day"></svg>
      <div class="control" style="margin-top:12px">
        <label>Solar irradiance <output id="irrOut">1360 W/m²</output></label>
        <input type="range" id="irr" min="200" max="1360" step="10" value="1360">
      </div>
      <div class="grid-2">
        <div class="stats">
          <div class="stat"><div class="k">Share of rated</div><div class="v" id="pctOut">100%</div></div>
          <div class="stat"><div class="k">Study status</div><div class="v" style="font-size:15px;padding-top:6px" id="statusOut"></div></div>
        </div>
        <div class="callout" id="dayTxt" style="margin:0"></div>
      </div>
    </div>

    <div class="foot">IAC-26,C3,IP,5,x111168 · Mammadli &amp; Rasulzada · BHOS · Supported by T3 Vakfı IAC 2026 Young Researcher Support Program</div>
  </section>
</main>
<script src="/assets/embed.js"></script>
<script>
const $ = (id) => document.getElementById(id);

/* ---------- lunar day ---------- */
const sky = $("sky");
function drawDay() {
  const g = +$("irr").value, pct = g / 1360;
  $("irrOut").textContent = g + " W/m²";
  $("pctOut").textContent = Math.round(pct * 100) + "%";
  IP.clear(sky);
  const W = 700, H = 220, cx = W / 2, base = 190, R = 160;
  const grad = IP.svg("linearGradient", { id: "gnd", x1: 0, y1: 0, x2: 0, y2: 1 }, IP.svg("defs", {}, sky));
  IP.svg("stop", { offset: 0, "stop-color": "#4a4d55" }, grad); IP.svg("stop", { offset: 1, "stop-color": "#25272c" }, grad);
  for (let i = 0; i < 40; i++) IP.svg("circle", { cx: (i * 137) % W, cy: (i * 53) % 150, r: (i % 3) * 0.4 + 0.4, fill: "#fff", opacity: 0.35 }, sky);
  IP.svg("path", { d: `M${cx - R},${base} A${R},${R} 0 0 1 ${cx + R},${base}`, fill: "none", stroke: "#555a63", "stroke-dasharray": "3 5" }, sky);
  // threshold zone 20–25% of rated, on the left (dawn) half of the arc
  const angFor = (p) => Math.asin(Math.min(1, p)); // elevation proxy: irradiance ∝ sin(elevation)
  const pt = (el) => [cx - R * Math.cos(el), base - R * Math.sin(el)];
  const [x1, y1] = pt(angFor(0.2)), [x2, y2] = pt(angFor(0.25));
  IP.svg("path", { d: `M${x1},${y1} A${R},${R} 0 0 1 ${x2},${y2}`, fill: "none", stroke: "#f0a04b", "stroke-width": 6, "stroke-linecap": "round", opacity: 0.8 }, sky);
  IP.text(sky, x1 - 8, y1 + 4, "20–25% rated", { "text-anchor": "end", style: "fill:#f0a04b" });
  IP.svg("rect", { x: 0, y: base, width: W, height: H - base, fill: "url(#gnd)" }, sky);
  IP.text(sky, cx - R, base + 18, "dawn ~200 W/m²", { "text-anchor": "middle" });
  IP.text(sky, cx, base - R - 10, "lunar noon 1360 W/m²", { "text-anchor": "middle" });
  const [sx, sy] = pt(angFor(pct));
  IP.svg("circle", { cx: sx, cy: sy, r: 22, fill: "#f0c35a", opacity: 0.15 }, sky);
  IP.svg("circle", { cx: sx, cy: sy, r: 11, fill: "#f6d27a" }, sky);
  // PV array silhouette
  for (let i = 0; i < 6; i++) IP.svg("rect", { x: cx - 110 + i * 38, y: base - 14, width: 30, height: 9, fill: "#2f5bb7", stroke: "#7fa6ea", "stroke-width": 0.6, transform: `skewX(-25)` }, sky);

  let status, txt;
  if (g >= 1350) {
    status = '<span class="pill good">Evaluated</span>';
    txt = "Rated point: SHE angles are exact (residual 3.36 × 10⁻⁹), targeted low-order harmonics sit at the noise floor, and residual THD concentrates at the 19th order and above.";
  } else if (pct > 0.25) {
    status = '<span class="pill warn">Future work</span>';
    txt = "Off the design point, M must fall with irradiance. The Table 2 angles no longer satisfy the elimination condition, so the low-order spectrum is expected to start repopulating. Quantifying that is the first extension.";
  } else {
    status = '<span class="pill bad">Future work</span>';
    txt = "Below ~20–25% of rated, theory predicts a pronounced, non-linear rise in current THD (control non-linearities, limited PWM resolution, no stabilising grid impedance). Active filtering becomes essential here.";
  }
  $("statusOut").innerHTML = status;
  $("dayTxt").innerHTML = txt;
}
$("irr").addEventListener("input", drawDay);
drawDay();
</script>
</body>
</html>
